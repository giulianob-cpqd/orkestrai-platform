// â”€â”€ CÃLCULO â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
let grandTotal = 0;
PHASES.forEach(p => p.groups.forEach(g => g.components.forEach(c => { grandTotal += c.features.length; })));
let cumImpl = 0;
PHASES.forEach(p => {
  let pf=0, pi=0;
  p.groups.forEach(g => g.components.forEach(c => {
    pf += c.features.length;
    if(c.impl==='done') pi += c.features.length;
    else if(c.impl==='partial') pi += Math.floor(c.features.length*.5);
  }));
  p._feats=pf; p._impl=pi; cumImpl+=pi; p._cumImpl=cumImpl;
});

// â”€â”€ GLOBAL BAR â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const COLORS=['#6366f1','#10b981','#f59e0b'];
const gbt=document.getElementById('globalBarTrack');
const gbl=document.getElementById('globalBarLegend');
PHASES.forEach((p,i)=>{
  const pct=Math.round(p._feats/grandTotal*100);
  gbt.innerHTML+=`<div class="global-bar-seg" style="width:${pct}%;background:${COLORS[i]}"></div>`;
  gbl.innerHTML+=`<div class="gbl-item"><div class="gbl-dot" style="background:${COLORS[i]}"></div>Fase ${p.phase} â€” ${pct}% (${p._feats} features)</div>`;
});
const implPct=Math.round((PHASES[0]._impl+PHASES[1]._impl)/grandTotal*100);
gbl.innerHTML+=`<div class="gbl-item"><div class="gbl-dot" style="background:#22c55e"></div><strong>${implPct}% implementado</strong> (Fases 1+2)</div>`;

// â”€â”€ RENDER â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
const timeline=document.getElementById('timeline');
PHASES.forEach((phase,pi)=>{
  const allC=phase.groups.flatMap(g=>g.components);
  const doneC=allC.filter(c=>c.impl==='done').length;

  const cumPct=Math.round(phase._cumImpl/grandTotal*100);
  const g=allC.reduce((s,c)=>s+(c.genai||0),0);
  const m=allC.reduce((s,c)=>s+(c.ml||0),0);
  const b=allC.reduce((s,c)=>s+(c.both||0),0);
  const inf=allC.reduce((s,c)=>s+(c.infra||0),0);

  const card=document.createElement('div');
  card.className=`phase-card ph${phase.phase}`;
  card.innerHTML=`
    <div class="phase-header">
      <div>
        <div class="phase-badge" style="color:${phase.color};border-color:${phase.color}30;background:${phase.color}12">${phase.icon} Fase ${phase.phase}</div>

        <div class="phase-scenarios">${phase.scenarios.join(' Â· ')}</div>

      <div class="phase-stats">

        </div>
      </div>
    </div>
    <div class="phase-body">
      <div id="grp-${pi}"></div>
      <div class="phase-donut-wrap">
        <canvas id="donut-${pi}" width="180" height="180"></canvas>

          <div class="cum-bar-track"><div class="cum-bar-fill" style="width:${cumPct}%;background:${phase.color}"></div></div>
        </div>
      </div>
    </div>`;
  timeline.appendChild(card);

  const grpEl=document.getElementById(`grp-${pi}`);
  phase.groups.forEach(grp=>{

    grpEl.appendChild(gb);
    grp.components.forEach(c=>{
      const ci=document.createElement('div');
      ci.className='comp-item';
      const implCls={done:'cs-done',partial:'cs-partial',todo:'cs-todo'}[c.impl];
      const implLbl={done:'âœ… Implementado',partial:'âš ï¸ Parcial',todo:'âŒ Pendente'}[c.impl];
      ci.innerHTML=`
        <div class="comp-header">
          <span class="comp-icon">${c.icon}</span>
          <span class="comp-name">${c.name}</span>
          <span class="comp-layer">${c.layer}</span>
          <span class="comp-status ${implCls}">${implLbl}</span>
          <span class="comp-arrow">â–¶</span>
        </div>
        <div class="comp-features">
          <div class="feat-list">${c.features.map(f=>`<span class="feat-tag ft-${f.kind}">${f.text}</span>`).join('')}</div>
        </div>`;
      ci.querySelector('.comp-header').addEventListener('click',()=>ci.classList.toggle('open'));
      gb.appendChild(ci);
    });
  });

  const dd=[],dl=[],dbg=[],dbd=[];
  const kc=KIND_COLOR;
  if(g>0){dd.push(g);dl.push(`GenAI (${g})`);dbg.push(kc.genai.bg);dbd.push(kc.genai.border);}
  if(m>0){dd.push(m);dl.push(`ML/DL (${m})`);dbg.push(kc.ml.bg);dbd.push(kc.ml.border);}
  if(b>0){dd.push(b);dl.push(`Ambos (${b})`);dbg.push(kc.both.bg);dbd.push(kc.both.border);}
  if(inf>0){dd.push(inf);dl.push(`Infra (${inf})`);dbg.push(kc.infra.bg);dbd.push(kc.infra.border);}
  const dtot=dd.reduce((a,x)=>a+x,0);
  new Chart(document.getElementById(`donut-${pi}`).getContext('2d'),{
    type:'doughnut',
    data:{labels:dl,datasets:[{data:dd,backgroundColor:dbg,borderColor:dbd,borderWidth:2,hoverOffset:6}]},
    options:{cutout:'58%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${Math.round(ctx.raw/dtot*100)}%`}}},animation:{duration:500}}
  });
  const dlegEl=document.getElementById(`dleg-${pi}`);
  dl.forEach((lbl,li)=>{
    dlegEl.innerHTML+=`<li><span class="dl-dot" style="background:${dbd[li]}"></span><span class="dl-label">${lbl}</span><span class="dl-val">${Math.round(dd[li]/dtot*100)}%</span></li>`;
  });
});
