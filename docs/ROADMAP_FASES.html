    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

    .subtitle { text-align:center; font-size:.85rem; color:#64748b; margin-bottom:48px; }

    .global-bar-wrap {

      background:#161c28; border:1px solid #1f2d3d; border-radius:14px; padding:24px 28px;
    }
    .global-bar-title { font-size:.72rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#475569; margin-bottom:16px; }
    .global-bar-track { display:flex; height:14px; border-radius:7px; overflow:hidden; gap:2px; margin-bottom:12px; }
    .global-bar-seg { height:100%; transition:width .6s ease; }
    .global-bar-legend { display:flex; gap:20px; flex-wrap:wrap; }
    .gbl-item { display:flex; align-items:center; gap:6px; font-size:.78rem; }
    .gbl-dot { width:10px; height:10px; border-radius:50%; }

    .timeline { max-width:900px; margin:0 auto; position:relative; }
    .timeline::before {
      content:''; position:absolute; left:28px; top:0; bottom:0;
      width:2px; background:linear-gradient(to bottom,#3b4f73,#1f2d3d);
    }

    .phase-card {
      position:relative; margin-bottom:40px; margin-left:72px;
      background:#161c28; border:1px solid #1f2d3d;
      border-radius:16px; overflow:hidden;
    }
    .phase-card::before {
      content:''; position:absolute; left:-52px; top:28px;
      width:14px; height:14px; border-radius:50%;
      border:2px solid var(--phase-color);
      background:#0c0f1a;
      box-shadow: 0 0 0 4px color-mix(in srgb, var(--phase-color) 20%, transparent);
    }

    .phase-header {
      display:grid; grid-template-columns:1fr auto;
      align-items:start; gap:16px;
      padding:24px 28px 20px;
      border-bottom:1px solid #1f2d3d;
      background:linear-gradient(135deg, color-mix(in srgb, var(--phase-color) 8%, transparent), transparent);
    }
    .phase-badge {
      display:inline-flex; align-items:center; gap:6px;
      font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.12em;
      padding:4px 10px; border-radius:20px; border:1px solid;
      margin-bottom:8px;
    }
    .phase-title { font-size:1.15rem; font-weight:800; color:#f1f5f9; margin-bottom:4px; }
    .phase-scenarios { font-size:.8rem; color:var(--phase-color); font-weight:600; margin-bottom:5px; }
    .phase-desc  { font-size:.82rem; color:#64748b; line-height:1.5; max-width:500px; }

    .phase-stats {
      display:flex; flex-direction:column; gap:10px; min-width:160px; align-items:flex-end;
    }
    .stat-pct {
      font-size:2.6rem; font-weight:900; letter-spacing:-.06em;
      line-height:1; color:var(--phase-color);
    }
    .stat-label { font-size:.7rem; color:#475569; text-align:right; }
    .stat-counts { display:flex; gap:8px; margin-top:4px; }
    .stat-count {
      font-size:.72rem; padding:3px 8px; border-radius:6px;
      background:rgba(255,255,255,.05); border:1px solid #2d3748;
      color:#94a3b8;
    }
    .stat-count strong { color:#f1f5f9; }

    .phase-body { padding:20px 28px; display:grid; grid-template-columns:1fr 220px; gap:20px; }
    @media(max-width:700px){ .phase-body { grid-template-columns:1fr; } }

    .group-block { margin-bottom:16px; }
    .group-header {
      display:flex; align-items:center; gap:8px; margin-bottom:8px;
      font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#475569;
    }
    .group-line { flex:1; height:1px; background:#1f2d3d; }

    .comp-item {
      background:#111827; border:1px solid #1f2d3d; border-radius:10px;
      overflow:hidden; cursor:pointer; transition:border-color .18s; margin-bottom:6px;
    }
    .comp-item:hover { border-color:var(--phase-color); }
    .comp-header {
      display:flex; align-items:center; gap:10px; padding:10px 14px;
      user-select:none;
    }
    .comp-icon { font-size:.9rem; flex-shrink:0; }
    .comp-name { flex:1; font-size:.82rem; font-weight:600; color:#e2e8f0; }
    .comp-layer { font-size:.65rem; color:#475569; }
    .comp-status {
      font-size:.62rem; font-weight:700; padding:2px 7px; border-radius:12px;
      border:1px solid transparent;
    }
    .cs-done    { background:rgba(34,197,94,.12);  border-color:rgba(34,197,94,.3);  color:#86efac; }
    .cs-partial { background:rgba(251,191,36,.12); border-color:rgba(251,191,36,.3); color:#fde68a; }
    .cs-todo    { background:rgba(239,68,68,.12);  border-color:rgba(239,68,68,.3);  color:#fca5a5; }

    .comp-arrow { font-size:.68rem; color:#475569; transition:transform .2s; flex-shrink:0; }
    .comp-item.open .comp-arrow { transform:rotate(90deg); }

    .comp-features { display:none; padding:0 14px 12px; }
    .comp-item.open .comp-features { display:block; }

    .feat-list { display:flex; flex-wrap:wrap; gap:4px; }
    .feat-tag {
      font-size:.68rem; padding:2px 8px; border-radius:16px; border:1px solid transparent;
    }
    .ft-genai { background:rgba(139,92,246,.13); border-color:rgba(139,92,246,.35); color:#c4b5fd; }
    .ft-ml    { background:rgba(251,146,60,.13);  border-color:rgba(251,146,60,.35);  color:#fdba74; }
    .ft-both  { background:rgba(56,189,248,.13);  border-color:rgba(56,189,248,.35);  color:#7dd3fc; }
    .ft-infra { background:rgba(100,116,139,.13); border-color:rgba(100,116,139,.35); color:#94a3b8; }

    .phase-donut-wrap { display:flex; flex-direction:column; align-items:center; gap:12px; }
    .phase-donut-wrap canvas { max-width:180px; }
    .donut-legend { list-style:none; display:flex; flex-direction:column; gap:6px; width:100%; }
    .donut-legend li { display:flex; align-items:center; gap:7px; font-size:.74rem; }
    .dl-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dl-label { flex:1; color:#94a3b8; }
    .dl-val   { font-weight:700; color:#f1f5f9; font-size:.72rem; }

    .cum-bar-wrap { margin-top:16px; width:100%; }
    .cum-bar-label { font-size:.68rem; color:#475569; margin-bottom:5px; }
    .cum-bar-track { height:8px; background:#1f2d3d; border-radius:4px; overflow:hidden; }
    .cum-bar-fill  { height:100%; border-radius:4px; transition:width .8s ease; }

    footer { text-align:center; margin-top:48px; font-size:.7rem; color:#334155; }

    .ph2 { --phase-color:#10b981; }
    .ph3 { --phase-color:#f59e0b; }
  </style>

// ══════════════════════════════════════════════════════
// CÁLCULO DE TOTAIS
// ══════════════════════════════════════════════════════
let grandTotal = 0;
PHASES.forEach(p => p.groups.forEach(g => g.components.forEach(c => { grandTotal += c.features.length; })));

let cumImpl = 0;
PHASES.forEach((p, pi) => {
  let pf = 0, pimpl = 0;
  p.groups.forEach(g => g.components.forEach(c => {
    pf += c.features.length;
    if (c.impl === 'done')    pimpl += c.features.length;
    else if (c.impl === 'partial') pimpl += Math.floor(c.features.length * 0.5);
  }));
  p._feats = pf;
  p._impl  = pimpl;
  cumImpl += pimpl;
  p._cumImpl = cumImpl;
});

// Global bar
const track  = document.getElementById('globalBarTrack');
const legend = document.getElementById('globalBarLegend');
const colors = ['#6366f1','#10b981','#f59e0b'];
PHASES.forEach((p, pi) => {
  const pct = Math.round(p._feats / grandTotal * 100);
  track.innerHTML += `<div class="global-bar-seg" style="width:${pct}%;background:${colors[pi]}"></div>`;
  legend.innerHTML += `<div class="gbl-item"><div class="gbl-dot" style="background:${colors[pi]}"></div>Fase ${p.phase} — ${pct}% (${p._feats} features)</div>`;
});
const implPct = Math.round((PHASES[0]._impl + PHASES[1]._impl) / grandTotal * 100);
legend.innerHTML += `<div class="gbl-item"><div class="gbl-dot" style="background:#22c55e"></div><strong>${implPct}% implementado</strong> (Fases 1+2)</div>`;

// ══════════════════════════════════════════════════════
// RENDER
// ══════════════════════════════════════════════════════
const KIND_CLASS_MAP = { genai:'ft-genai', ml:'ft-ml', both:'ft-both', infra:'ft-infra' };
const KIND_COLOR_MAP = {
  genai: { bg:'rgba(139,92,246,.8)', border:'#8b5cf6' },
  ml:    { bg:'rgba(251,146,60,.8)',  border:'#fb923c' },
  both:  { bg:'rgba(56,189,248,.8)',  border:'#38bdf8' },
  infra: { bg:'rgba(100,116,139,.7)', border:'#64748b' },
};
const timeline = document.getElementById('timeline');

PHASES.forEach((phase, pi) => {
  const allComps  = phase.groups.flatMap(g => g.components);
  const doneC  = allComps.filter(c => c.impl === 'done').length;
  const todoC  = allComps.filter(c => c.impl === 'todo').length;
  const cumPct = Math.round(phase._cumImpl / grandTotal * 100);

  const g = allComps.reduce((s,c)=>s+(c.genai||0),0);
  const m = allComps.reduce((s,c)=>s+(c.ml||0),0);
  const b = allComps.reduce((s,c)=>s+(c.both||0),0);
  const i = allComps.reduce((s,c)=>s+(c.infra||0),0);

  const card = document.createElement('div');
  card.className = `phase-card ph${phase.phase}`;

  card.innerHTML = `
    <div class="phase-header">
      <div>
        <div class="phase-badge" style="color:${phase.color};border-color:${phase.color}30;background:${phase.color}12">
          ${phase.icon} Fase ${phase.phase}
        </div>
        <div class="phase-title">${phase.title}</div>
        <div class="phase-scenarios">${phase.scenarios.join(' · ')}</div>
        <div class="phase-desc">${phase.subtitle}</div>
      </div>
      <div class="phase-stats">
        <div class="stat-pct">${Math.round(phase._feats/grandTotal*100)}%</div>
        <div class="stat-label">do total de features</div>
        <div class="stat-counts">
          <div class="stat-count"><strong>${allComps.length}</strong> comp.</div>
          <div class="stat-count"><strong>${phase._feats}</strong> features</div>
        </div>
        <div class="stat-counts" style="margin-top:2px">
          <div class="stat-count" style="color:#86efac"><strong>${doneC}</strong> ✅</div>
          ${todoC>0?`<div class="stat-count" style="color:#fca5a5"><strong>${todoC}</strong> ❌</div>`:''}
        </div>
      </div>
    </div>
    <div class="phase-body">
      <div id="groups-${pi}"></div>
      <div class="phase-donut-wrap">
        <canvas id="donut-${pi}" width="180" height="180"></canvas>
        <ul class="donut-legend" id="dlegend-${pi}"></ul>
        <div class="cum-bar-wrap">
          <div class="cum-bar-label">Acumulado implementado: <strong style="color:${phase.color}">${cumPct}%</strong></div>
          <div class="cum-bar-track"><div class="cum-bar-fill" style="width:${cumPct}%;background:${phase.color}"></div></div>
        </div>
      </div>
    </div>`;

  timeline.appendChild(card);

  // Groups
  const groupsEl = document.getElementById(`groups-${pi}`);
  phase.groups.forEach(grp => {
    const gb = document.createElement('div');
    gb.className = 'group-block';
    gb.innerHTML = `<div class="group-header"><span>${grp.name}</span><div class="group-line"></div></div>`;
    groupsEl.appendChild(gb);

    grp.components.forEach(c => {
      const ci = document.createElement('div');
      ci.className = 'comp-item';
      ci.innerHTML = `
        <div class="comp-header">
          <span class="comp-icon">${c.icon}</span>
          <span class="comp-name">${c.name}</span>
          <span class="comp-layer">${c.layer}</span>
          <span class="comp-status ${IMPL_CLASS[c.impl]}">${IMPL_LABEL[c.impl]}</span>
          <span class="comp-arrow">▶</span>
        </div>
        <div class="comp-features">
          <div class="feat-list">
            ${c.features.map(f=>`<span class="feat-tag ${KIND_CLASS_MAP[f.kind]}">${f.text}</span>`).join('')}
          </div>
        </div>`;
      ci.querySelector('.comp-header').addEventListener('click', () => ci.classList.toggle('open'));
      gb.appendChild(ci);
    });
  });

  // Donut
  const dd=[], dl=[], dbg=[], dbd=[];
  if(g>0){dd.push(g);dl.push(`GenAI (${g})`);dbg.push(KIND_COLOR_MAP.genai.bg);dbd.push(KIND_COLOR_MAP.genai.border);}
  if(m>0){dd.push(m);dl.push(`ML/DL (${m})`);dbg.push(KIND_COLOR_MAP.ml.bg);dbd.push(KIND_COLOR_MAP.ml.border);}
  if(b>0){dd.push(b);dl.push(`Ambos (${b})`);dbg.push(KIND_COLOR_MAP.both.bg);dbd.push(KIND_COLOR_MAP.both.border);}
  if(i>0){dd.push(i);dl.push(`Infra (${i})`);dbg.push(KIND_COLOR_MAP.infra.bg);dbd.push(KIND_COLOR_MAP.infra.border);}
  const dtot = dd.reduce((a,x)=>a+x,0);

  new Chart(document.getElementById(`donut-${pi}`).getContext('2d'), {
    type:'doughnut',
    data:{ labels:dl, datasets:[{ data:dd, backgroundColor:dbg, borderColor:dbd, borderWidth:2, hoverOffset:6 }] },
    options:{ cutout:'58%', plugins:{ legend:{display:false}, tooltip:{ callbacks:{ label:ctx=>` ${ctx.label}: ${Math.round(ctx.raw/dtot*100)}%` }}}, animation:{duration:500} }
  });

  const dleg = document.getElementById(`dlegend-${pi}`);
  dl.forEach((lbl,li) => {
    dleg.innerHTML += `<li><span class="dl-dot" style="background:${dbd[li]}"></span><span class="dl-label">${lbl}</span><span class="dl-val">${Math.round(dd[li]/dtot*100)}%</span></li>`;
  });
});
