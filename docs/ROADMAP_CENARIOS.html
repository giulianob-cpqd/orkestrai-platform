<head>

  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#0c0f1a; color:#e2e8f0; min-height:100vh; padding:40px 24px; }

    h1 { text-align:center; font-size:1.65rem; font-weight:800; letter-spacing:-.03em; color:#f8fafc; margin-bottom:6px; }
    .subtitle { text-align:center; font-size:.85rem; color:#64748b; margin-bottom:48px; line-height:1.6; }

    /* ── Cenário cards no topo ── */
    .scenarios { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; max-width:960px; margin:0 auto 48px; }
    @media(max-width:700px){ .scenarios { grid-template-columns:1fr; } }

    .scenario-card {
      border-radius:14px; border:1px solid; padding:20px;
      background:linear-gradient(135deg, var(--bg1), var(--bg2));
    }
    .sc-emoji  { font-size:1.8rem; margin-bottom:8px; }
    .sc-phase  { font-size:.65rem; font-weight:800; text-transform:uppercase; letter-spacing:.14em; color:var(--col); margin-bottom:4px; }
    .sc-title  { font-size:.96rem; font-weight:800; color:#f1f5f9; margin-bottom:6px; line-height:1.3; }
    .sc-sub    { font-size:.74rem; color:#64748b; line-height:1.5; }
    .sc-tags   { display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; }
    .sc-tag    { font-size:.66rem; padding:2px 8px; border-radius:12px; border:1px solid; font-weight:600; }

    /* ── Global bar ── */
    .global-bar-wrap { max-width:960px; margin:0 auto 48px; background:#161c28; border:1px solid #1f2d3d; border-radius:14px; padding:22px 26px; }
    .gbar-title { font-size:.7rem; font-weight:700; text-transform:uppercase; letter-spacing:.1em; color:#475569; margin-bottom:14px; }
    .gbar-track { display:flex; height:16px; border-radius:8px; overflow:hidden; gap:3px; margin-bottom:14px; }
    .gbar-seg   { height:100%; transition:width .6s; border-radius:4px; }
    .gbar-legend { display:flex; gap:20px; flex-wrap:wrap; }
    .gbl { display:flex; align-items:center; gap:6px; font-size:.76rem; color:#94a3b8; }
    .gbl-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }

    /* ── Timeline ── */
    .timeline { max-width:960px; margin:0 auto; position:relative; }
    .timeline::before { content:''; position:absolute; left:26px; top:0; bottom:0; width:2px; background:linear-gradient(to bottom,#3b4f73,#111827); }

    /* ── Phase card ── */
    .phase-card { position:relative; margin-bottom:40px; margin-left:66px; background:#161c28; border:1px solid #1f2d3d; border-radius:16px; overflow:hidden; }
    .phase-card::before { content:''; position:absolute; left:-46px; top:30px; width:16px; height:16px; border-radius:50%; border:2px solid var(--phase-color); background:#0c0f1a; box-shadow:0 0 0 5px color-mix(in srgb, var(--phase-color) 18%, transparent); }

    /* ── Phase header ── */
    .phase-header { padding:24px 26px 18px; border-bottom:1px solid #1f2d3d; display:grid; grid-template-columns:1fr auto; gap:16px; background:linear-gradient(135deg, color-mix(in srgb, var(--phase-color) 7%, transparent), transparent); }
    .phase-badge  { display:inline-flex; align-items:center; gap:6px; font-size:.66rem; font-weight:800; text-transform:uppercase; letter-spacing:.14em; padding:3px 10px; border-radius:20px; border:1px solid; margin-bottom:8px; color:var(--phase-color); border-color:color-mix(in srgb, var(--phase-color) 40%, transparent); background:color-mix(in srgb, var(--phase-color) 10%, transparent); }
    .phase-title  { font-size:1.12rem; font-weight:800; color:#f1f5f9; margin-bottom:3px; }
    .phase-scenarios { font-size:.78rem; color:var(--phase-color); font-weight:600; margin-bottom:5px; }
    .phase-desc   { font-size:.8rem; color:#64748b; line-height:1.5; max-width:520px; }
    .phase-stats  { display:flex; flex-direction:column; gap:8px; min-width:150px; align-items:flex-end; }
    .stat-pct     { font-size:2.8rem; font-weight:900; letter-spacing:-.06em; line-height:1; color:var(--phase-color); }
    .stat-label   { font-size:.68rem; color:#475569; text-align:right; }
    .stat-row     { display:flex; gap:7px; margin-top:4px; }
    .stat-pill    { font-size:.68rem; padding:2px 8px; border-radius:6px; background:rgba(255,255,255,.05); border:1px solid #2d3748; color:#94a3b8; }
    .stat-pill strong { color:#f1f5f9; }

    /* ── Phase body ── */
    .phase-body { padding:18px 26px; display:grid; grid-template-columns:1fr 210px; gap:20px; }
    @media(max-width:700px){ .phase-body { grid-template-columns:1fr; } }

    /* ── Grupos dentro da fase ── */
    .group-block { margin-bottom:16px; }
    .group-header { display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:.68rem; font-weight:800; text-transform:uppercase; letter-spacing:.1em; color:#475569; }
    .group-line { flex:1; height:1px; background:#1f2d3d; }

    /* ── Component items ── */
    .comp-item { background:#111827; border:1px solid #1f2d3d; border-radius:9px; margin-bottom:6px; overflow:hidden; cursor:pointer; transition:border-color .15s; }
    .comp-item:hover { border-color:var(--phase-color); }
    .comp-header { display:flex; align-items:center; gap:9px; padding:9px 13px; user-select:none; }
    .comp-icon   { font-size:.9rem; flex-shrink:0; }
    .comp-name   { flex:1; font-size:.8rem; font-weight:600; color:#e2e8f0; }
    .comp-layer  { font-size:.62rem; color:#475569; }
    .comp-status { font-size:.6rem; font-weight:700; padding:2px 6px; border-radius:10px; border:1px solid; flex-shrink:0; }
    .cs-done    { background:rgba(34,197,94,.1);  border-color:rgba(34,197,94,.3);  color:#86efac; }
    .cs-partial { background:rgba(251,191,36,.1); border-color:rgba(251,191,36,.3); color:#fde68a; }
    .cs-todo    { background:rgba(239,68,68,.1);  border-color:rgba(239,68,68,.3);  color:#fca5a5; }
    .comp-arrow { font-size:.65rem; color:#475569; transition:transform .18s; flex-shrink:0; }
    .comp-item.open .comp-arrow { transform:rotate(90deg); }
    .comp-features { display:none; padding:0 13px 10px; }
    .comp-item.open .comp-features { display:block; }
    .feat-wrap { display:flex; flex-wrap:wrap; gap:4px; }
    .feat-tag { font-size:.68rem; padding:2px 8px; border-radius:14px; border:1px solid transparent; }
    .ft-genai { background:rgba(139,92,246,.12); border-color:rgba(139,92,246,.32); color:#c4b5fd; }
    .ft-ml    { background:rgba(251,146,60,.12);  border-color:rgba(251,146,60,.32);  color:#fdba74; }
    .ft-both  { background:rgba(56,189,248,.12);  border-color:rgba(56,189,248,.32);  color:#7dd3fc; }
    .ft-infra { background:rgba(100,116,139,.12); border-color:rgba(100,116,139,.32); color:#94a3b8; }

    /* ── Donut ── */
    .phase-donut-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .donut-legend { list-style:none; display:flex; flex-direction:column; gap:5px; width:100%; }
    .donut-legend li { display:flex; align-items:center; gap:6px; font-size:.72rem; }
    .dl-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
    .dl-label { flex:1; color:#94a3b8; }
    .dl-val { font-weight:700; color:#f1f5f9; font-size:.7rem; }
    .cum-bar-wrap { margin-top:14px; width:100%; }
    .cum-bar-label { font-size:.66rem; color:#475569; margin-bottom:5px; }
    .cum-bar-track { height:8px; background:#1f2d3d; border-radius:4px; overflow:hidden; }
    .cum-bar-fill  { height:100%; border-radius:4px; transition:width .8s; }

    footer { text-align:center; margin-top:48px; font-size:.7rem; color:#334155; }
  </style>
</head>

// CÁLCULO DE TOTAIS
// ══════════════════════════════════════════════════════════════════
let grandTotal = 0;
PHASES.forEach(p => p.groups.forEach(g => g.components.forEach(c => { grandTotal += c.features.length; })));

let cumFeats = 0;
PHASES.forEach((p,pi) => {
  let pf = 0, pi2 = 0;
  p.groups.forEach(g => g.components.forEach(c => {
    pf += c.features.length;
    if (c.impl === 'done') pi2 += c.features.length;
    else if (c.impl === 'partial') pi2 += Math.floor(c.features.length * 0.5);
  }));
  p._feats = pf;
  p._impl  = pi2;
  cumFeats += pf;
});

// ── Scenario cards ──
const scEl = document.getElementById('scenarioCards');
PHASES.forEach(p => {
  const pct = Math.round(p._feats / grandTotal * 100);
  const card = document.createElement('div');
  card.className = 'scenario-card';
  card.style.cssText = `--col:${p.color}; --bg1:color-mix(in srgb,${p.color} 8%,#0c0f1a); --bg2:#0c0f1a; border-color:color-mix(in srgb,${p.color} 25%,transparent)`;
  card.innerHTML = `
    <div class="sc-emoji">${p.emoji}</div>
    <div class="sc-phase">Fase ${p.phase} · ${pct}% das features</div>
    <div class="sc-title">${p.title}</div>
    <div class="sc-sub">${p.scenarios.join(' · ')}</div>
    <div class="sc-tags">${p.scenarioTags.map(t => `<span class="sc-tag" style="color:${t.color};border-color:${t.color}40;background:${t.color}12">${t.label}</span>`).join('')}</div>`;
  scEl.appendChild(card);
});

// ── Global bar ──
let cf = 0;
const gbt = document.getElementById('gbarTrack');
const gbl = document.getElementById('gbarLegend');
let implFeats = 0;
PHASES.forEach(p => {
  const pct = Math.round(p._feats / grandTotal * 100);
  gbt.innerHTML += `<div class="gbar-seg" style="width:${pct}%;background:${p.color}"></div>`;
  cf += p._feats;
  implFeats += p._impl;
  gbl.innerHTML += `<div class="gbl"><div class="gbl-dot" style="background:${p.color}"></div>Fase ${p.phase} · ${pct}% (${p._feats} features)</div>`;
});
const globalImplPct = Math.round(implFeats / grandTotal * 100);
gbl.innerHTML += `<div class="gbl"><div class="gbl-dot" style="background:#22c55e"></div><strong style="color:#f1f5f9">${globalImplPct}% implementado</strong></div>`;

// RENDER FASES
// ══════════════════════════════════════════════════════════════════
const timeline = document.getElementById('timeline');
let cumulImpl = 0;

PHASES.forEach((phase, pi) => {
  const allComps   = phase.groups.flatMap(g => g.components);
  const totalComps = allComps.length;
  const doneComps  = allComps.filter(c => c.impl === 'done').length;
  const todoComps  = allComps.filter(c => c.impl === 'todo').length;
  cumulImpl += phase._impl;
  const cumPct = Math.round(cumulImpl / grandTotal * 100);

  const g = allComps.reduce((s,c)=>s+(c.genai||0),0);
  const m = allComps.reduce((s,c)=>s+(c.ml||0),0);
  const b = allComps.reduce((s,c)=>s+(c.both||0),0);
  const i = allComps.reduce((s,c)=>s+(c.infra||0),0);

  const card = document.createElement('div');
  card.className = `phase-card ${phase.cssClass}`;
  card.style.cssText = `--phase-color:${phase.color}`;

  card.innerHTML = `
    <div class="phase-header">
      <div>
        <div class="phase-badge">${phase.emoji} Fase ${phase.phase}</div>
        <div class="phase-title">${phase.title}</div>
        <div class="phase-scenarios">${phase.scenarios.join(' · ')}</div>
        <div class="phase-desc">${phase.subtitle}</div>
      </div>
      <div class="phase-stats">
        <div class="stat-pct">${Math.round(phase._feats/grandTotal*100)}%</div>
        <div class="stat-label">das features totais</div>
        <div class="stat-row">
          <div class="stat-pill"><strong>${totalComps}</strong> componentes</div>
          <div class="stat-pill"><strong>${phase._feats}</strong> features</div>
        </div>
        <div class="stat-row">
          <div class="stat-pill" style="color:#86efac"><strong>${doneComps}</strong> ✅</div>
          ${todoComps>0?`<div class="stat-pill" style="color:#fca5a5"><strong>${todoComps}</strong> ❌</div>`:''}
        </div>
      </div>
    </div>
    <div class="phase-body">
      <div id="groups-${pi}"></div>
      <div class="phase-donut-wrap">
        <canvas id="donut-${pi}" width="180" height="180"></canvas>
        <ul class="donut-legend" id="dlegend-${pi}"></ul>
        <div class="cum-bar-wrap">
          <div class="cum-bar-label">Acumulado implementado: <strong style="color:${phase.color}">${cumPct}%</strong></div>
          <div class="cum-bar-track"><div class="cum-bar-fill" style="width:${cumPct}%;background:${phase.color}"></div></div>
        </div>
      </div>
    </div>`;

  timeline.appendChild(card);

  // ── Groups & Components ──
  const groupsEl = document.getElementById(`groups-${pi}`);
  phase.groups.forEach(grp => {
    const gb = document.createElement('div');
    gb.className = 'group-block';
    gb.innerHTML = `<div class="group-header"><span>${grp.name}</span><div class="group-line"></div></div>`;
    groupsEl.appendChild(gb);

    grp.components.forEach(c => {
      const tot = (c.genai||0)+(c.ml||0)+(c.both||0)+(c.infra||0);
      const ci  = document.createElement('div');
      ci.className = 'comp-item';
      ci.innerHTML = `
        <div class="comp-header">
          <span class="comp-icon">${c.icon}</span>
          <div style="flex:1;min-width:0">
            <div class="comp-name">${c.name}</div>
            ${c.relevance?`<div style="font-size:.68rem;color:#475569;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${c.relevance}</div>`:''}
          </div>
          <span class="comp-layer">${c.layer}</span>
          <span class="comp-status ${IMPL_CLASS[c.impl]}">${IMPL_LABEL[c.impl]}</span>
          <span class="comp-arrow">▶</span>
        </div>
        <div class="comp-features">
          <div class="feat-wrap">
            ${c.features.map(f=>`<span class="feat-tag ${KIND_CLASS[f.kind]}">${f.text}</span>`).join('')}
          </div>
        </div>`;
      ci.querySelector('.comp-header').addEventListener('click', () => ci.classList.toggle('open'));
      gb.appendChild(ci);
    });
  });

  // ── Donut ──
  const dd=[],dl=[],db=[],dbc=[];
  if(g>0){dd.push(g);dl.push(`GenAI (${g})`);db.push(KIND_COLOR.genai.bg);dbc.push(KIND_COLOR.genai.border);}
  if(m>0){dd.push(m);dl.push(`ML (${m})`);db.push(KIND_COLOR.ml.bg);dbc.push(KIND_COLOR.ml.border);}
  if(b>0){dd.push(b);dl.push(`Ambos (${b})`);db.push(KIND_COLOR.both.bg);dbc.push(KIND_COLOR.both.border);}
  if(i>0){dd.push(i);dl.push(`Infra (${i})`);db.push(KIND_COLOR.infra.bg);dbc.push(KIND_COLOR.infra.border);}
  const dtot=dd.reduce((a,x)=>a+x,0);

  new Chart(document.getElementById(`donut-${pi}`).getContext('2d'),{
    type:'doughnut',
    data:{labels:dl,datasets:[{data:dd,backgroundColor:db,borderColor:dbc,borderWidth:2,hoverOffset:6}]},
    options:{cutout:'58%',plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>` ${ctx.label}: ${Math.round(ctx.raw/dtot*100)}%`}}},animation:{duration:500}}
  });
  const dleg=document.getElementById(`dlegend-${pi}`);
  dl.forEach((lbl,li)=>{
    dleg.innerHTML+=`<li><span class="dl-dot" style="background:${dbc[li]}"></span><span class="dl-label">${lbl}</span><span class="dl-val">${Math.round(dd[li]/dtot*100)}%</span></li>`;
  });
});
</script>
</body>
</html>
